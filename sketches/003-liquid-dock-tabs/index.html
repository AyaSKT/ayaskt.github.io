<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liquid Dock Tabs Preview</title>
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", sans-serif;
      color: #172230;
      background:
        linear-gradient(180deg, rgba(248,252,255,0.96), rgba(243,247,252,0.86)),
        linear-gradient(140deg, #dff1fb 0%, #eef0ff 46%, #fff0f6 100%);
      overflow-x: hidden;
    }
    body.dark {
      color: #edf6ff;
      background:
        linear-gradient(180deg, rgba(9,14,21,0.94), rgba(15,21,31,0.90)),
        linear-gradient(140deg, #112e42 0%, #232844 46%, #3b2835 100%);
    }
    a, button { font: inherit; }
    button { border: 0; cursor: pointer; }
    .page {
      min-height: 100dvh;
      padding: 0 28px 54px;
    }
    .site-nav {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      width: min(1180px, 100%);
      height: 76px;
      margin: 0 auto;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 218px;
      color: inherit;
      text-decoration: none;
      font-weight: 650;
      letter-spacing: 0;
    }
    .brand-logo {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(140deg, #98cbea, #c2c7f8 54%, #f1dce4);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.72), 0 8px 20px rgba(96,128,154,0.15);
    }
    .nav-right {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px;
      border: 1px solid rgba(255,255,255,0.56);
      border-radius: 24px;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.62), rgba(255,255,255,0.28)),
        rgba(255,255,255,0.24);
      box-shadow:
        0 20px 64px rgba(76,106,134,0.18),
        inset 0 1px 0 rgba(255,255,255,0.82),
        inset 0 -18px 32px rgba(152,203,234,0.10);
      backdrop-filter: blur(24px) saturate(1.36);
      -webkit-backdrop-filter: blur(24px) saturate(1.36);
    }
    body.dark .nav-right {
      border-color: rgba(255,255,255,0.16);
      background:
        linear-gradient(135deg, rgba(255,255,255,0.14), rgba(255,255,255,0.05)),
        rgba(12,18,27,0.52);
      box-shadow:
        0 22px 70px rgba(0,0,0,0.38),
        inset 0 1px 0 rgba(255,255,255,0.14),
        inset 0 -18px 32px rgba(0,0,0,0.15);
    }
    .search {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 18px;
      color: rgba(35,48,64,0.70);
      background: rgba(255,255,255,0.28);
      transition: background 0.2s ease, transform 0.2s ease, color 0.2s ease;
    }
    body.dark .search {
      color: rgba(232,240,250,0.76);
      background: rgba(255,255,255,0.07);
    }
    .search:hover,
    .search:focus-visible {
      color: #17384d;
      background: rgba(255,255,255,0.58);
      transform: translateY(-2px);
      outline: none;
    }
    body.dark .search:hover,
    body.dark .search:focus-visible {
      color: #f7fbff;
      background: rgba(255,255,255,0.14);
    }
    .search-mark {
      width: 15px;
      height: 15px;
      border: 2px solid currentColor;
      border-radius: 50%;
      position: relative;
    }
    .search-mark::after {
      position: absolute;
      right: -5px;
      bottom: -4px;
      width: 6px;
      height: 2px;
      border-radius: 2px;
      background: currentColor;
      transform: rotate(45deg);
      content: "";
    }
    .tabs {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .tab {
      position: relative;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-width: 64px;
      height: 48px;
      padding: 0 10px;
      border-radius: 19px;
      color: rgba(35,48,64,0.66);
      text-decoration: none;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 620;
      transition: color 0.2s ease, background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }
    body.dark .tab { color: rgba(232,240,250,0.72); }
    .tab::before {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: currentColor;
      opacity: 0.42;
      content: "";
    }
    .tab:hover,
    .tab.open {
      color: #1d4258;
      background: rgba(255,255,255,0.34);
      transform: translateY(-2px);
    }
    body.dark .tab:hover,
    body.dark .tab.open {
      color: #f6fbff;
      background: rgba(255,255,255,0.10);
    }
    .tab.active {
      color: #17384d;
      background:
        linear-gradient(150deg, rgba(255,255,255,0.96), rgba(255,255,255,0.62));
      box-shadow:
        0 10px 28px rgba(74,101,126,0.18),
        inset 0 1px 0 rgba(255,255,255,0.95);
      transform: translateY(-3px);
    }
    body.dark .tab.active {
      color: #f7fbff;
      background:
        linear-gradient(150deg, rgba(255,255,255,0.20), rgba(255,255,255,0.09));
      box-shadow:
        0 12px 30px rgba(0,0,0,0.32),
        inset 0 1px 0 rgba(255,255,255,0.16);
    }
    .tool-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 18px;
      color: rgba(35,48,64,0.66);
      background: rgba(255,255,255,0.24);
      text-decoration: none;
      font-size: 12px;
      font-weight: 680;
      transition: color 0.2s ease, background 0.2s ease, transform 0.2s ease;
    }
    body.dark .tool-button {
      color: rgba(232,240,250,0.72);
      background: rgba(255,255,255,0.07);
    }
    .tool-button:hover,
    .tool-button:focus-visible {
      color: #17384d;
      background: rgba(255,255,255,0.58);
      transform: translateY(-2px);
      outline: none;
    }
    body.dark .tool-button:hover,
    body.dark .tool-button:focus-visible {
      color: #f7fbff;
      background: rgba(255,255,255,0.14);
    }
    .dropdown {
      position: absolute;
      top: 66px;
      right: 122px;
      display: none;
      width: 270px;
      padding: 9px;
      border: 1px solid rgba(255,255,255,0.52);
      border-radius: 22px;
      background:
        linear-gradient(145deg, rgba(255,255,255,0.78), rgba(255,255,255,0.40)),
        rgba(255,255,255,0.24);
      box-shadow: 0 24px 66px rgba(76,106,134,0.22), inset 0 1px 0 rgba(255,255,255,0.82);
      backdrop-filter: blur(24px) saturate(1.34);
      -webkit-backdrop-filter: blur(24px) saturate(1.34);
    }
    body.dark .dropdown {
      border-color: rgba(255,255,255,0.15);
      background:
        linear-gradient(145deg, rgba(31,40,55,0.76), rgba(15,21,31,0.58)),
        rgba(14,19,28,0.50);
      box-shadow: 0 24px 66px rgba(0,0,0,0.42), inset 0 1px 0 rgba(255,255,255,0.12);
    }
    .dropdown.show { display: block; }
    .menu-link {
      display: block;
      padding: 10px 12px;
      border-radius: 14px;
      color: inherit;
      text-decoration: none;
      font-size: 14px;
      line-height: 1.35;
    }
    .menu-link:hover { background: rgba(152,203,234,0.18); }
    body.dark .menu-link:hover { background: rgba(152,203,234,0.13); }
    .content {
      width: min(960px, 100%);
      margin: 90px auto 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 34px;
      align-items: stretch;
    }
    .paper,
    .stack {
      border: 1px solid rgba(255,255,255,0.50);
      background: rgba(255,255,255,0.44);
      box-shadow: 0 20px 70px rgba(84,113,140,0.13), inset 0 1px 0 rgba(255,255,255,0.76);
      backdrop-filter: blur(16px) saturate(1.16);
      -webkit-backdrop-filter: blur(16px) saturate(1.16);
    }
    body.dark .paper,
    body.dark .stack {
      border-color: rgba(255,255,255,0.13);
      background: rgba(20,27,38,0.44);
      box-shadow: 0 20px 70px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.10);
    }
    .paper {
      border-radius: 28px;
      padding: 28px;
    }
    .stack {
      border-radius: 24px;
      padding: 18px;
    }
    h1 {
      margin: 0 0 18px;
      font-size: clamp(34px, 6vw, 62px);
      line-height: 1.04;
      letter-spacing: 0;
    }
    p {
      max-width: 64ch;
      margin: 0;
      color: rgba(35,48,64,0.70);
      line-height: 1.82;
    }
    body.dark p { color: rgba(226,237,250,0.72); }
    .stack-item {
      padding: 14px 0;
      border-bottom: 1px solid rgba(35,48,64,0.10);
      color: rgba(35,48,64,0.75);
    }
    .stack-item:last-child { border-bottom: 0; }
    body.dark .stack-item {
      border-bottom-color: rgba(255,255,255,0.11);
      color: rgba(226,237,250,0.78);
    }
    @media (max-width: 940px) {
      .page { padding: 0 16px 46px; }
      .site-nav { height: auto; padding-top: 12px; align-items: flex-start; }
      .brand span:last-child { display: none; }
      .nav-right {
        max-width: calc(100vw - 78px);
        overflow-x: auto;
        scrollbar-width: none;
      }
      .nav-right::-webkit-scrollbar { display: none; }
      .tool-extra { display: none; }
      .content {
        margin-top: 70px;
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <nav class="site-nav" aria-label="Preview navigation">
      <a class="brand" href="#">
        <span class="brand-logo" aria-hidden="true"></span>
        <span>Ayaskt Workspace</span>
      </a>
      <div class="nav-right">
        <button class="search" type="button" aria-label="Search">
          <span class="search-mark" aria-hidden="true"></span>
        </button>
        <div class="tabs" role="tablist" aria-label="Main navigation">
          <a class="tab active" href="#" role="tab" aria-selected="true">主页</a>
          <button class="tab" type="button" data-menu="year3">大三</button>
          <button class="tab" type="button" data-menu="year2">大二</button>
          <button class="tab" type="button" data-menu="year1">大一</button>
        </div>
        <button class="tool-button" type="button" id="themeToggle" aria-label="Toggle theme">月</button>
        <a class="tool-button tool-extra" href="#" aria-label="GitHub">GH</a>
        <a class="tool-button tool-extra" href="#" aria-label="UESTC">U</a>
      </div>
      <div class="dropdown" id="year3">
        <a class="menu-link" href="#">通信原理与系统 CPS</a>
        <a class="menu-link" href="#">人工智能与机器学习 AIML</a>
        <a class="menu-link" href="#">数字信号处理 DSP</a>
        <a class="menu-link" href="#">电磁场与波 EMFT</a>
        <a class="menu-link" href="#">通信电路设计 CCD</a>
        <a class="menu-link" href="#">工程项目管理与财务 EPM&F</a>
      </div>
      <div class="dropdown" id="year2">
        <a class="menu-link" href="#">嵌入式处理器 EP</a>
        <a class="menu-link" href="#">电路分析与设计 CAD</a>
      </div>
      <div class="dropdown" id="year1">
        <a class="menu-link" href="#">微电子系统 MS</a>
      </div>
    </nav>
    <section class="content">
      <article class="paper">
        <h1>Liquid dock tab bar</h1>
        <p>这个方向更像 iOS dock 和 SwiftUI tab bar 的混合体：每个 tab 都是小按钮，选中项轻微上浮。它更活泼，但会改变 VitePress 原导航的信息密度。</p>
      </article>
      <aside class="stack">
        <div class="stack-item">DSP 离散时间系统</div>
        <div class="stack-item">EMFT Maxwell 方程组</div>
        <div class="stack-item">AIML 特征选择</div>
      </aside>
    </section>
  </main>
  <script>
    const buttons = document.querySelectorAll('[data-menu]')
    const menus = document.querySelectorAll('.dropdown')
    buttons.forEach((button) => {
      button.addEventListener('click', () => {
        const id = button.dataset.menu
        const menu = document.getElementById(id)
        const willOpen = !menu.classList.contains('show')
        menus.forEach((item) => item.classList.remove('show'))
        buttons.forEach((item) => item.classList.remove('open'))
        if (willOpen) {
          menu.classList.add('show')
          button.classList.add('open')
        }
      })
    })
    document.getElementById('themeToggle').addEventListener('click', (event) => {
      document.body.classList.toggle('dark')
      event.currentTarget.textContent = document.body.classList.contains('dark') ? '日' : '月'
    })
    document.addEventListener('click', (event) => {
      if (!event.target.closest('.site-nav')) {
        menus.forEach((item) => item.classList.remove('show'))
        buttons.forEach((item) => item.classList.remove('open'))
      }
    })
  </script>
</body>
</html>
